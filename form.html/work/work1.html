<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form  action="" style="border: 1px solid black;
                margin: auto;
                width: 20%;
                height: 30%; 
                padding: 10px;
                border-radius: 20px;
                background-color: bisque;">
        <h1 style="font-size: 25px; 
        color: rgba(9, 94, 169, 0.347); 
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        justify-content: center;
        display: flex;
        border: 1px solid black;
        border-radius: 10px;" 
        ><i><b>Student Registeration Form</b></i></h1>
        <hr size="4" color="brown">
        
        <br>
        <label style="color: rgb(139, 24, 24); 
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                font-size: 18px;" 
                for="">Full Name:</label>
        <br>
        <input style="width: 80%;
                height: 20px;
                text-align: center;
                background-color: honeydew;
                border-radius: 15px;" 
                type="text" placeholder="Enter Your Full Name">

        <br>
        <label style="color: rgb(139, 24, 24); 
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                font-size: 18px;" for="">Username:</label>
        <br>
        <input style="width: 80%;
                height: 20px;
                text-align: center;
                background-color: honeydew;
                border-radius: 15px;"  type="text" placeholder="Enter Username">
        <br>
        <br>
        <label style="color: rgb(139, 24, 24); 
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                font-size: 18px;" for="">Password:</label>
        <br>
        <input style="width: 80%;
                height: 20px;
                text-align: center;
                background-color: honeydew;
                border-radius: 15px;" type="text" placeholder="Enter Password">
        <br>
        <br>
        <label style="color: rgb(139, 24, 24); 
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                font-size: 18px;" for="">Email:</label>
        <br>
        <input style="width: 80%;
                height: 20px;
                text-align: center;
                background-color: honeydew;
                border-radius: 15px;" type="text" placeholder="Enter Email">
        <br>
        <br>
        <label style="color: rgb(139, 24, 24);

                font-size: 18px;" for="">Age:</label>

        <input style="width: 80%;
                height: 20px;
                text-align: center;
                background-color: honeydew;
                border-radius: 15px;" type="text" placeholder="Enter Age">
        <br>
        <br>
        <label style="color: rgb(139, 24, 24); 
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                font-size: 18px;" for="">Phone:</label>
        <br>
        <input style="width: 80%;
                height: 20px;
                text-align: center;
                background-color: honeydew;
                border-radius: 15px;" type="text" placeholder="Enter Phone Number">
        <br>
        <br>
        <button>Register</button>
        <button>Clear</button>
    </form>
