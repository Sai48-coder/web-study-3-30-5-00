<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tag</title>
</head>
<body>
    <h1 style="color: darkmagenta; text-align: center; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; font-size: 50px;"><i><u>Form</u></i></h1>
    <hr size="3" color="red">

    <form action="" style="border: 1px solid black; 
                    width: 18%; 
                    height: 40%; 
                    padding: 10px; 
                    background-color: bisque;
                    margin: auto;
                    border-radius: 15px;">
        <p style="color: coral; text-align: center;">Register</p>
        
        <br>
        <hr size="2" color="black">
        <br>
        <label for=""><i>Enter Email</i></label><br>
        <input style="width: 250px; height: 25px; background-color: azure; border-radius: 15px;" type="text" placeholder="Enter Your Email"> 
        <br>
        <br>

        <label for="">Please Enter Password</label> <br>
        <input style="width: 250px; height: 25px; background-color: azure; border-radius: 15px;" type="text" placeholder="Enter Your Password">
        <br>
        <br>

        <label for="">Enter Comfirm Password</label><br>
        <input style="width: 250px; height: 25px; background-color: azure; border-radius: 15px;" type="text" placeholder="Enter Your Comfirm Password">
        <br>
        <br>

        <label for="">Enter Your Name</label><br>
        <input style="width: 250px; height: 25px; background-color: azure; border-radius: 15px;" type="text" placeholder="Enter Your Name">
        <br>
        <br>

        <label for="">Enter Your ID</label><br>
        <input style="height: 25px; width: 250px; background-color: azure; border-radius: 15px;" type="text" placeholder="Enter Your ID">
        <br>
        <br>

        <button style="width: 250px; height: 25px; border-radius: 15px; font-family: Georgia, 'Times New Roman', Times, serif; color: brown;">Sign Up</button>



        <!-- margin: kom leat khang krav -->
        <!-- padding: kom leak khang knong -->
        <!-- border-radius: use somrab style kem ex: dak oy khorng jea derm -->


    </form>
</body>
</html>
