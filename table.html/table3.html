<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table3</title>

        </thead>

            </tr>
            <tr>
                <td>2</td>
                <td>Fong</td>
                <td>Female</td>
                <td>95</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Sal</td>
                <td>Male</td>
                <td>49</td>
                <td align="center" style="background-color: brown;">Fail</td>
            </tr>
            <tr>
                <td>4</td>

            <tr>

        </tbody>
    </table>
</body>
</html>
