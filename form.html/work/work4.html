<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="border: 1px solid rgba(155, 151, 151, 0.61); 
        font-size: 15px;
        font-family:'Times New Roman', Times, serif ;
        width: 25vw;
        height: 60vh;
        border-radius: 25px;
        background-color: antiquewhite;
        padding: 15px;
        margin: auto;">
    <form action="">
        <h1><i><b>Student Registeration Form</b></i></h1>

        <hr size="2" color="black">

        <br>
        <label for="">Full Name:</label>
        <input type="text" style="border-radius: 25px; height: 25px;">
        <br>
        <br>
        <label for="">Email Address:</label>
        <input type="text" style="border-radius: 25px; height: 25px;">
        <br>
        <br>
        <label for="">Password:</label>
        <input type="text" style="border-radius: 25px; height: 25px;">
        <br>
        <br>
        <label for="">Date of Birth:</label>
        <input type="date">
        <br>
        <label for="">Gender:</label>
        <input type="radio">
        <label for="">Female</label>
        <input type="radio">
        <label for="">Male</label>
        <br>
        <label for="">Course</label>

        <select name="" id="">
            <option value="">HTML</option>
            <option value="">CSS</option>
            <option value="">JAVA Script</option>
        </select>

        <br>
        <label for="">Skills You Have</label>
        <br>
        <input type="checkbox">
        <label for="">HTML</label>
        <br>
        <input type="checkbox">
        <label for="">CSS</label>
        <br>
        <input type="checkbox">
        <label for="">JAVASRIPT</label>
        <br>
        <label for="">Additional Comments:</label>
        <br>
        <textarea name="" id="" placeholder="Enter Your Comments"></textarea>
        <br>
        <label for="">Upload Your File:</label>
        <br>
        <input type="file">
        <br>
        <br>
        <button>Upload</button>
        <br>
        <br>
        <button>Register</button>
    </form>    
        
    </div>
    
</body>
</html>
