<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="color: brown; font-family: 'Times New Roman', Times, serif; font-size: 40px;">
        <i><u>Unordered List Exercise</u></i></h1>
    
    <h1>Example 1: Fruits</h1>
    <ul style="list-style-type: disc;">
        <li>
            Apple
        </li>
        <li>
            Banana
        </li>
        <li>
            Orange
        </li>
        <li>
            Mango
        </li>
    </ul>
    <h1>Example 2: School Supplies</h1>
    <ul style="list-style-type: square;">
        <li>
            Pen
        </li>
        <li>
            Notebook
        </li>
        <li>
            Ruler
        </li>
        <li>
            Eraser
        </li>
    </ul>
    <h1>Example 3: Hobbies</h1>
    <ul style="list-style-type: circle;">
        <li>
            Reading
        </li>
        <li>
            Dreawing
        </li>
        <li>
            Playing Football
        </li>
        <li>
            Listenning Music
        </li>

    </ul>    
</body>
</html>
