<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Table</title>
</head>
<body>
    <h1 align="center" style="color: brown; font-family: 'Times New Roman', Times, serif; font-size: 40px;"><i><u>Know About The Table Tag</u></i></h1>
    <hr size="4" color="black">

    <!-- Create table row -->
    <table border="1" align="center" style="width: 70%; font-size: 25px; border-collapse: 2px; border: 2px solid blue; border-spacing: 0px; ">
        <tr style="background-color: blanchedalmond;">
            <th>ID</th>
            <th>Name</th>
            <th>Gender</th>
            <th>Score</th>
        </tr>
        <tr style="color: pink;" align="center">
            <td>01</td>
            <td>Sai</td>
            <td>Male</td>
            <td>90</td>
            
        </tr>
        <tr style="color: aqua;" align="center">
            <td>02</td>
            <td>Sal</td>
            <td>Male</td>
            <td>99</td>
            
        </tr>
        <tr align="center">
            <td>03</td>
            <td>fong</td>
            <td>Female</td>
            <td>100</td>
            
        </tr>
        <tr align="center">
            <td>04</td>
            <td>Ly</td>
            <td>Male</td>
            <td>98</td>
            
        </tr>
    </table>
</body>
</html>
